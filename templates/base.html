<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020e1e">
    <meta name="description" content="NovaLabs: software, automatización e inteligencia artificial para impulsar tu negocio.">
    <title>{% block title %}NovaLabs — Soluciones Digitales{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=funcional-1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/funcional.css') }}?v=1">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <meta property="og:title" content="NovaLabs — Ideas que funcionan">
    <meta property="og:description" content="Desarrollo web, sistemas a medida y automatización para tu negocio.">
    <meta property="og:type" content="website">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenido">Ir al contenido</a>

    <!-- Iconos vectoriales incluidos: no necesitan una librería externa. -->
    <svg class="svg-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-9 8.5 10 10 0 0 1-4-.8L3 21l1.5-5A8 8 0 0 1 3 11.5a9 9 0 0 1 18 0Z"/></symbol>
        <symbol id="icon-cart" viewBox="0 0 24 24"><path d="M2 3h3l3 13h11l3-10H6"/><circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/></symbol>
        <symbol id="icon-gear" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 2 1 2-.3 2 3-1.2 1.7.2 2.3 2 1v3l-2 1-.2 2.3 1.2 1.7-2 3-2-.3-2 1-1 2h-4l-1-2-2-1-2 .3-2-3 1.2-1.7L4 15l-2-1v-3l2-1 .2-2.3L3 6l2-3 2 .3 2-1Z" transform="translate(1 1) scale(.9)"/><circle cx="12" cy="12" r="3.5"/></symbol>
        <symbol id="icon-brain" viewBox="0 0 24 24"><path d="M12 4C10 0 5 2 5 6 1 6 1 11 4 12 0 16 4 20 7 19c1 4 5 3 5 0V4Zm0 0c2-4 7-2 7 2 4 0 4 5 1 6 4 4 0 8-3 7-1 4-5 3-5 0M5 6l3 1v3m-4 2h4m-1 7v-4m12-9-3 1v3m4 2h-4m1 7v-4"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="m14 1-11 13h8L9 23l12-14h-8l1-8Z"/></symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 5-5 9-9 11-4-2-9-6-9-11V6l9-4Z"/><path d="m8 12 3 3 5-6"/></symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M3 21h4V12H3Zm7 0h4V7h-4Zm7 0h4V2h-4Z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="3.5"/><rect x="14" y="3" width="7" height="7" rx="3.5"/><rect x="3" y="14" width="7" height="7" rx="3.5"/><rect x="14" y="14" width="7" height="7" rx="3.5"/></symbol>
        <symbol id="icon-support" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3m0 3c0 4-3 5-7 5"/><rect x="2" y="11" width="4" height="7" rx="2"/><rect x="18" y="11" width="4" height="7" rx="2"/><path d="M9 15q3 3 6 0"/><circle cx="9" cy="10" r=".5"/><circle cx="15" cy="10" r=".5"/></symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5M2 20l7-8m13 8-7-8"/></symbol>
        <symbol id="icon-phone" viewBox="0 0 24 24"><path d="m7 2 3 5-3 3c2 4 3 5 7 7l3-3 5 3c-1 7-6 6-11 3C5 17-2 8 2 3l5-1Z"/></symbol>
        <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-linkedin" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2" fill="currentColor" stroke="none"/><path d="M7 10v8m5 0v-8m0 3c1-4 6-4 6 0v5" stroke="#020e1e" stroke-width="2.5"/><circle cx="7" cy="6.5" r="1.2" fill="#020e1e" stroke="none"/></symbol>
        <symbol id="icon-github" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3 19.5v-3c-3 .7-4-1.3-4-1.3-.5-1.3-1.2-1.7-1.2-1.7 1.1-.1 1.7 1.3 1.7 1.3.9 1.2 2.3.8 3.6.5.2-.8.5-1.3.9-1.6-3.1-.4-6-1.4-6-6 0-1.3.5-2.3 1.3-3.2-.1-.4-.5-1.8.2-3.2 0 0 1.1-.3 3.3 1.2a11 11 0 0 1 6 0c2.2-1.5 3.3-1.2 3.3-1.2.7 1.4.3 2.8.2 3.2.8.9 1.3 1.9 1.3 3.2 0 4.6-2.9 5.6-6 6 .5.4.9 1.2.9 2.4v4A10 10 0 0 0 12 2Z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-youtube" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="5" fill="currentColor" stroke="none"/><path d="m10 8 6 4-6 4Z" fill="#020e1e" stroke="none"/></symbol>
      </defs>
    </svg>

    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
